# =============================================================================
# 11. Impact 与风险评估
# =============================================================================
impacts:
  - area: "用户行为"
    description: |
      用户从手动浏览变为命令行操作。需要基本终端使用能力。
      原本需要数小时的工作可能缩短到数十分钟。
    severity: "中等"

  - area: "业务规则"
    description: |
      工具不存储或分发视频内容，仅保存 URL 和 AI 生成的提纲。
      提纲是 AI 的衍生创作，非原始视频内容复制。
    severity: "低"

  - area: "数据与隐私"
    description: |
      处理记录和输出文件中包含视频 URL 和标题——属于公开信息。
      但 API Key 和 Cookie 是敏感凭据，需安全存储。
    severity: "高"

  - area: "合规性"
    description: |
      抖音用户协议禁止未经许可的自动化数据采集。
      工具必须展示免责声明，且用户需自行承担使用风险。
      豆包 AI 使用需遵循火山引擎服务条款。
    severity: "高"

  - area: "兼容性"
    description: |
      依赖抖音前端 DOM 结构（若用 Playwright 方案），
      抖音改版可能导致采集失败。需持续维护选择器。
    severity: "中高"

  - area: "交付范围"
    description: |
      数据采集方案的可行性（OD-001）是最大不确定性。
      如果方案A/B/C/D都不可行，项目可能需要重新评估。
    severity: "高"

risks:
  - id: "RISK-001"
    title: "抖音反爬导致采集失败"
    trigger: "抖音更新反爬策略或检测到自动化行为"
    impact: "工具完全无法采集视频列表，核心功能失效"
    likelihood: "中高"
    severity: "严重"
    mitigation: "使用 Playwright 模拟真实浏览器；随机化操作间隔；必要时降级为用户手动粘贴页面源码"
    decision_needed_by: "架构师"

  - id: "RISK-002"
    title: "豆包 API 成本不可控"
    trigger: "博主视频数量远超预期（如 5000+）"
    impact: "单次运行 API 费用可能高达数十至上百元"
    likelihood: "中"
    severity: "中等"
    mitigation: "运行前显示预估视频数量并请求确认；支持--limit 参数限制处理数量"
    decision_needed_by: "主理人 / 用户"

  - id: "RISK-003"
    title: "豆包 API 视频理解能力不足"
    trigger: "豆包多模态模型无法有效理解抖音视频内容"
    impact: "生成提纲质量差，用户不满意，工具价值大打折扣"
    likelihood: "中"
    severity: "中高"
    mitigation: "MVP 先用标题+描述生成提纲；验证效果后再决定是否引入帧提取等多模态方案"
    decision_needed_by: "主理人 / 用户"

  - id: "RISK-004"
    title: "抖音改版破坏采集选择器"
    trigger: "抖音 Web 版更新页面结构"
    impact: "Playwright 选择器失效，采集失败"
    likelihood: "中"
    severity: "中等"
    mitigation: "选择器配置外部化（独立配置文件）；添加采集前自检步骤"
    decision_needed_by: "架构师"

  - id: "RISK-005"
    title: "账号安全风险"
    trigger: "用户使用个人抖音账号 Cookie 进行自动化操作"
    impact: "抖音可能将该行为判定为异常并限制账号功能"
    likelihood: "低中"
    severity: "中高"
    mitigation: "合规声明必须醒目；建议用户使用测试账号；采集频率温和"
    decision_needed_by: "主理人 / 用户"

# =============================================================================
# 12. 待确认清单 (For Confirmation)
# =============================================================================
for_confirmation:
  - id: "CONFIRM-001"
    item: "数据采集方案选择（OD-001）"
    recommendation: "Playwright 浏览器自动化"
    reason: "平衡可用性和维护成本"
    ask: "请确认是否接受 Playwright 方案，或有其他偏好？"

  - id: "CONFIRM-002"
    item: "AI 视频理解深度（OD-002）"
    recommendation: "MVP 先基于标题+描述元数据生成提纲"
    reason: "控制成本和复杂度，快速验证核心价值"
    ask: "仅基于标题和描述生成提纲是否满足需求？还是必须视频内容级别的理解？"

  - id: "CONFIRM-003"
    item: "增量采集为默认行为（OD-003）"
    recommendation: "默认开启增量，提供 --no-skip 参数强制全量"
    reason: "节省 API 成本，批处理场景的核心需求"
    ask: "增量跳过已处理视频是否为必须功能？"

  - id: "CONFIRM-004"
    item: "输入方式（OD-004）"
    recommendation: "命令行参数 --user，后续可扩展配置文件"
    reason: "符合 CLI 工具惯例，MVP 最简单可用"
    ask: "命令行 --user 参数方式是否满足需求？"

  - id: "CONFIRM-005"
    item: "合规风险认知（OD-005）"
    recommendation: "工具启动时展示免责声明，不做硬性阻止"
    reason: "平衡工具可用性和法律风险提示"
    ask: "请确认用户已知悉并接受数据采集的法律风险？"

  - id: "CONFIRM-006"
    item: "输出格式"
    recommendation: "默认 JSON，内部提纲字段为 Markdown 文本"
    reason: "JSON 程序友好，Markdown 人类可读，兼顾两者"
    ask: "JSON + 内部 Markdown 提纲的组合是否满足需求？"

  - id: "CONFIRM-007"
    item: "视频数量上限"
    recommendation: "运行前展示预估视频数并要求确认，支持 --limit 参数"
    reason: "防止意外的高额 API 费用"
    ask: "是否需要视频数量确认机制和 --limit 参数？"
