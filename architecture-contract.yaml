  - name: "volcengine ARK API (豆包大模型)"
    version: "OpenAI 兼容接口 /v3"
    purpose: "调用豆包大模型生成视频内容文字提纲"
    auth: "ARK_API_KEY（通过 .env 配置）"
    config_source: ".env 文件"
    timeout: "60 秒（单次 API 调用）"
    retry: "超时或 5xx 错误最多重试 2 次，指数退避"
