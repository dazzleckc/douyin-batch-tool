# =============================================================================
# 验证计划
# =============================================================================
verification_plan:
  developer_checks:
    - id: "dev-check-01"
      step: "静态检查"
      command: "python -m py_compile src/*.py main.py"
      expected: "无错误"
    - id: "dev-check-02"
      step: "配置自检"
      command: "python -c 'from src.config import load_config; c=load_config(); print(c)'"
      expected: "配置对象正确打印"
    - id: "dev-check-03"
      step: "数据库初始化"
      command: "python -c 'from src.db import ProcessDB; db=ProcessDB(\":memory:\"); print(db.processed_count())'"
      expected: "返回 0"
    - id: "dev-check-04"
      step: "合规声明显示"
      command: "python -c 'from src.disclaimer import show; show()'"
      expected: "终端打印合规文本"
    - id: "dev-check-05"
      step: "JSON 输出格式正确"
      command: "python -c 'from src.output import write_results; ...'（单元测试覆盖）"
      expected: "JSON 可解析，字段齐全"
    - id: "dev-check-06"
      step: "AI 客户端 Mock 测试"
      command: "pytest tests/test_ai_client.py -v"
      expected: "通过（使用 Mock ARK API）"
    - id: "dev-check-07"
      step: "Pipeline Mock 测试"
      command: "pytest tests/test_pipeline.py -v"
      expected: "通过（使用 Mock scraper + Mock AI）"

  independent_checks:
    - id: "indep-check-01"
      step: "完整 Golden Path 端到端"
      description: "在配置了真实 .env 的环境下运行完整流程"
      command: "python main.py --user <测试博主URL> --limit 3"
      expected: "合规声明 → 采集 3 个视频 → AI 解析 → JSON 输出"
      requires: "真实 ARK_API_KEY + DOUYIN_COOKIE"
    - id: "indep-check-02"
      step: "增量跳过验证"
      description: "同一博主运行两次，第二次应全部跳过"
      command: "python main.py --user <同一URL> --limit 3"
      expected: "第二次运行显示 3 跳过，0 处理"
    - id: "indep-check-03"
      step: "无效输入"
      description: "不传 --user 参数"
      command: "python main.py"
      expected: "非零退出码 + 明确错误提示"
    - id: "indep-check-04"
      step: "API Key 无效"
      description: "使用无效 ARK_API_KEY"
      command: "ARK_API_KEY=invalid python main.py --user <URL>"
      expected: "明确鉴权错误信息 + 非零退出"
    - id: "indep-check-05"
      step: "无 .env 文件"
      description: "删除 .env 后运行"
      command: "python main.py --user <URL>"
      expected: "提示缺少配置 + 非零退出"

  non_mock_core_paths:
    - "Golden Path 端到端（indep-check-01）必须是真实验证"
    - "增量跳过（indep-check-02）必须是真实验证"
  allowed_mocks:
    - "AI 客户端单元测试可使用 Mock（避免消耗 API 配额）"
    - "Scraper 单元测试可使用 Mock Playwright page"
    - "数据库测试可使用 :memory: SQLite"
  blocking_failures:
    - "indep-check-01 (Golden Path) 失败 → 阻断 G5"
    - "indep-check-02 (增量跳过) 失败 → 阻断 G5"
    - "任何 AC 失败 → 阻断 G5"
    - "单元测试覆盖 < 70% → 不阻断但记录 warning"

