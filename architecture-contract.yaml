# =============================================================================
# 风险清单
# =============================================================================
risks:
  - id: "RISK-001"
    title: "抖音反爬导致采集失败"
    trigger: "抖音更新反爬策略或检测到自动化行为（如 headless 检测）"
    impact: "工具完全无法采集视频列表，核心功能失效"
    likelihood: "medium"
    mitigation: |
      1. 使用 Playwright 而非 requests（浏览器指纹更真实）
      2. 默认使用 headed 模式便于调试，headless 可选
      3. 随机化操作间隔（2-5s）
      4. 选择器配置外部化，便于快速适配 DOM 变化
    verification: "indep-check-01 通过即验证当前抖音版本可用"
    owner: "开发工程师"
    rollback: "选择器失效时更新 scraper.py 中的选择器配置文件"

  - id: "RISK-002"
    title: "豆包 API 成本不可控"
    trigger: "博主视频数量远超预期（500+）"
    impact: "单次运行 API 费用可能较高"
    likelihood: "low"
    mitigation: |
      1. 运行前显示预估视频数并请求确认
      2. --limit 参数限制处理数量
      3. 增量跳过默认开启
    verification: "indep-check-01 中 --limit 3 验证"
    owner: "用户（通过 --limit 控制）"
    rollback: "中断运行（Ctrl+C），已处理记录保留"

  - id: "RISK-003"
    title: "豆包 AI 提纲质量不满足期望"
    trigger: "基于标题+描述的提纲过于空泛"
    impact: "用户不满意工具价值"
    likelihood: "medium"
    mitigation: |
      1. 优化 Prompt 模板（提供提纲格式示例）
      2. 允许用户通过 .env 自定义 Prompt 后缀
      3. 输出中保留原始 AI 响应，用户可自行判断
    verification: "indep-check-01 中检查提纲质量"
    owner: "主理人（评估后决定是否升级到多模态方案）"
    rollback: "调整 Prompt 模板后重新运行"

  - id: "RISK-004"
    title: "抖音改版破坏采集选择器"
    trigger: "抖音 Web 版更新页面结构"
    impact: "Playwright 选择器失效，采集失败"
    likelihood: "medium"
    mitigation: |
      1. 选择器配置在 scraper.py 中以常量集中管理
      2. 采集前执行自检：尝试提取至少一个视频
      3. 自检失败时给出明确错误信息 + 建议检查 DOM 变化
    verification: "每次运行的第一个视频采集成功"
    owner: "开发工程师"
    rollback: "更新 scraper.py 中的选择器常量"

  - id: "RISK-005"
    title: "账号安全风险"
    trigger: "用户使用个人抖音账号 Cookie 进行自动化操作"
    impact: "抖音可能限制账号功能"
    likelihood: "low"
    mitigation: |
      1. 合规声明醒目展示
      2. 文档建议使用测试账号
      3. 采集频率温和（2-5s 随机间隔）
    verification: "合规声明文本审查"
    owner: "用户"
    rollback: "不适用"

  - id: "RISK-006"
    title: ".env 文件误提交到 Git"
    trigger: "开发者忘记 .gitignore 或误操作"
    impact: "API Key 和 Cookie 泄露"
    likelihood: "low"
    mitigation: ".gitignore 中明确忽略 .env、*.db、output/"
    verification: "git status 确认 .env 不在跟踪中"
    owner: "发布管理员（Phase 6 检查）"
    rollback: "立即轮换 API Key，git rm --cached .env"

# =============================================================================
# 重大决策
# =============================================================================
major_decisions:
  - id: "MD-001"
    decision: "选择 OpenAI 兼容 SDK 而非 volcengine-python-sdk[ark]"
    reason: |
      火山引擎官方推荐 OpenAI 兼容方式接入（文档明确支持）。
      openai SDK 更轻量、社区更成熟、接口更标准。
      不引入 volcengine 私有 SDK 的额外依赖和接口学习成本。
    impact: "接口调用方式与标准 OpenAI 一致，未来更换模型更容易"
    submitted_to: "无需升级——属于技术选型细节，架构师权限内"

  - id: "MD-002"
    decision: "使用同步 sqlite3 而非 aiosqlite"
    reason: |
      虽然 Playwright 是异步的，但数据库操作在整个流程中占比极小（毫秒级）。
      标准库 sqlite3 零依赖，足够满足需求。
      MVP 阶段不需要为数据库引入异步复杂度。
    impact: "数据库调用在 Playwright async 上下文中是同步的，性能影响可忽略"
    submitted_to: "无需升级"

  - id: "MD-003"
    decision: "采集方案：纯 Playwright 滚动加载，不尝试 API 直连"
    reason: |
      用户 OD-001 明确选择 Playwright 方案。
      避免引入 ABogus 签名逆向的复杂度。
      douyin-downloader 的双通道架构是为"下载视频"场景优化，
      我们的"仅采集元数据"场景更轻量，Playwright 滚动 + DOM 提取已足够。
    impact: "工具唯一依赖 Playwright，如果浏览器风控变严，需引入降级方案"
    submitted_to: "已由用户确认（OD-001）"

# =============================================================================
# 假设、未验证事项、阻塞
# =============================================================================
assumptions:
  - "抖音用户主页的 DOM 结构包含可识别的视频列表元素（参考 douyin-downloader 的经验，此假设大概率成立）"
  - "用户能通过浏览器开发者工具获取有效的 Cookie 值（含 s_v_web_id 或等效标识）"
  - "火山引擎 ARK API 的 OpenAI 兼容接口在调用时不需要额外开通（仅需 API Key）"
  - "豆包 seed-1.6 模型对中文标题提纲生成质量可接受"
  - "Playwright Chromium 在 macOS/Linux 上均可正常安装运行"
  - "用户的抖音 Cookie 有效期足够长（至少数小时），批处理期间不会过期"

unverified:
  - "抖音视频列表的实际 DOM 选择器——需在开发 scraper 时实测确定"
  - "豆包 API 的实际响应延迟和限流行为"
  - "Playwright 在 sandbox 环境中的浏览器启动行为"
  - "Cookie 中具体哪些字段是必需的（ttwid, sessionid 等）——需实测"

blockers: []

# =============================================================================
# 门禁建议
# =============================================================================
gate_recommendation:
  gate: "G3_PLAN_READY"
  status: "proposed"
  evidence_refs: []

# =============================================================================
# =============================================================================
# Phase 2.5: 模块拆解清单
# =============================================================================
# =============================================================================

module_breakdown:
  overview:
    total_modules: 10
    total_estimated_lines: ~545
    delivery_order: "按依赖顺序串行（WI-003/005 可与 WI-002/004 并行）"

  modules:
    - order: 1
      id: "WI-001"
      name: "项目骨架搭建"
      files:
        - "src/__init__.py (新增)"
        - "tests/__init__.py (新增)"
        - ".env.example (新增)"
        - ".gitignore (新增)"
      interface_contract: |
        无对外接口。本模块仅创建文件和目录结构。
      dependencies: []
      parallelizable: false
      estimated_lines: 25
      notes: |
        .env.example 包含：ARK_API_KEY=your_key_here, DOUYIN_COOKIE=your_cookie_here,
        ARK_BASE_URL=https://ark.cn-beijing.volces.com/api/v3,
        ARK_MODEL=doubao-seed-1-6-251015

    - order: 2
      id: "WI-002"
      name: "配置管理模块"
      files:
        - "src/config.py (新增)"
      interface_contract: |
        @dataclass
        class Config:
            ark_api_key: str
            douyin_cookie: str
            ark_base_url: str = "https://ark.cn-beijing.volces.com/api/v3"
            ark_model: str = "doubao-seed-1-6-251015"
            output_dir: str = "./output"
            request_interval_min: float = 2.0
            request_interval_max: float = 5.0
            headless: bool = True

        def load_config() -> Config:
            """从 .env 加载配置，校验必填项，返回 Config 对象"""
      dependencies: ["WI-001"]
      parallelizable: false
      estimated_lines: 50
      notes: |
        使用 python-dotenv 的 load_dotenv()。
        校验：ARK_API_KEY 和 DOUYIN_COOKIE 缺失时抛出 ConfigurationError。
        .env 不存在时给出明确提示（非静默失败）。

    - order: 3
      id: "WI-003"
      name: "数据模型定义"
      files:
        - "src/models.py (新增)"
      interface_contract: |
        from dataclasses import dataclass, field
        from datetime import datetime

        @dataclass
        class VideoInfo:
            aweme_id: str
            url: str
            title: str
            description: str = ""
            publish_time: str | None = None

        @dataclass
        class OutlineResult:
            aweme_id: str
            outline_markdown: str
            raw_response: str
            success: bool
            error_message: str = ""

        @dataclass
        class OutputRecord:
            url: str
            title: str
            outline: str
            timestamp: str
            status: str  # "success" | "failed" | "skipped"

        @dataclass
        class PipelineResult:
            total: int
            processed: int
            skipped: int
            failed: int
            errors: list[dict] = field(default_factory=list)
            output_file: str = ""
      dependencies: ["WI-001"]
      parallelizable: true  # 可与 WI-002 并行
      estimated_lines: 45
      notes: "纯数据结构，零依赖（仅标准库 dataclass）"

    - order: 4
      id: "WI-004"
      name: "SQLite 数据库模块"
      files:
        - "src/db.py (新增)"
      interface_contract: |
        class ProcessDB:
            def __init__(self, db_path: str = "processed.db") -> None
            def is_processed(self, aweme_id: str) -> bool
            def mark_processed(self, aweme_id: str, title: str = "") -> None
            def mark_failed(self, aweme_id: str, error: str) -> None
            def processed_count(self) -> int
            def get_failed_items(self) -> list[tuple[str, str]]
            def close(self) -> None
      dependencies: ["WI-003"]
      parallelizable: false
      estimated_lines: 55
      notes: |
        使用标准库 sqlite3。自动建表。
        processed_videos 表结构：aweme_id TEXT PK, title TEXT, status TEXT, error TEXT,
        processed_at TEXT DEFAULT (datetime('now'))

    - order: 5
      id: "WI-005"
      name: "合规声明模块"
      files:
        - "src/disclaimer.py (新增)"
      interface_contract: |
        DISCLAIMER_TEXT: str  # 模块级常量

        def show_disclaimer() -> None:
            """打印合规免责声明到 stdout"""
      dependencies: ["WI-001"]
      parallelizable: true  # 可与 WI-002/003/004 并行
      estimated_lines: 20
      notes: |
        包含固定的中文法律声明文本。
        声明内容：本工具仅供个人学习研究、不得商业使用、遵守抖音用户协议。

    - order: 6
      id: "WI-006"
      name: "抖音视频采集器"
      files:
        - "src/scraper.py (新增)"
      interface_contract: |
        class VideoScraper:
            def __init__(self, config: Config) -> None
            async def scrape_user_videos(
                self, user_url: str, limit: int | None = None
            ) -> list[VideoInfo]
            async def close(self) -> None

        class ScraperError(Exception): ...
        class UserNotFoundError(ScraperError): ...
        class NoVideosError(ScraperError): ...
        class AccessDeniedError(ScraperError): ...
      dependencies: ["WI-002", "WI-003"]
      parallelizable: false
      estimated_lines: 80
      notes: |
        Playwright async API。核心逻辑：
        1. 从 URL 提取 sec_uid
        2. 启动 Chromium（headless 可配置）
        3. 注入 Cookie
        4. 访问用户主页
        5. 滚动加载视频列表
        6. 从 DOM 提取视频信息
        7. 随机 sleep 2-5s 模拟人类行为
        DOM 选择器以常量定义在模块顶部，便于维护。
        这是最复杂的模块——Playwright 的滚动+提取逻辑需要实际调试。

    - order: 7
      id: "WI-007"
      name: "豆包 AI 客户端"
      files:
        - "src/ai_client.py (新增)"
      interface_contract: |
        class AIClient:
            def __init__(self, config: Config) -> None
            def generate_outline(self, title: str, description: str = "") -> OutlineResult

        class AIError(Exception): ...
        class AuthError(AIError): ...
        class TimeoutError(AIError): ...
      dependencies: ["WI-002"]
      parallelizable: true  # 可与 WI-006 并行
      estimated_lines: 60
      notes: |
        使用 openai.OpenAI，base_url 指向 ARK。
        Prompt 模板：
        "你是一个视频内容分析助手。请根据以下视频标题，推测视频内容并生成一份结构化的文字提纲。
        提纲应包含两级层级（一级要点和二级子要点），以 Markdown 格式输出。
        视频标题：{title}"
        超时 60s，最多重试 2 次。只支持同步调用（单视频处理，不需要异步）。

    - order: 8
      id: "WI-008"
      name: "结果输出模块"
      files:
        - "src/output.py (新增)"
      interface_contract: |
        def write_results(
            records: list[OutputRecord],
            output_path: str,
            indent: int = 2
        ) -> str:
            """写入 JSON 文件，返回实际文件路径。自动创建目录。"""

        def generate_output_filename(user_identifier: str) -> str:
            """生成 {标识}_{YYYYMMDD}.json 格式文件名"""
      dependencies: ["WI-003"]
      parallelizable: true  # 可与 WI-006/007 并行
      estimated_lines: 45
      notes: |
        使用标准库 json.dumps(ensure_ascii=False, indent=2)。
        特殊字符处理：emoji/换行符通过 ensure_ascii=False + JSON 标准转义。
        自动创建输出目录。

    - order: 9
      id: "WI-009"
      name: "流水线编排"
      files:
        - "src/pipeline.py (新增)"
      interface_contract: |
        async def run_pipeline(
            user_url: str,
            limit: int | None,
            output_dir: str,
            no_skip: bool,
            interval_range: tuple[float, float],
            config: Config,
        ) -> PipelineResult:
            """
            完整流水线：
            1. 创建 VideoScraper → 采集视频列表
            2. 创建 ProcessDB → 逐视频检查去重
            3. 创建 AIClient → 对未处理视频生成提纲
            4. 收集 OutputRecord → 调用 write_results
            5. 返回 PipelineResult
            """
      dependencies: ["WI-004", "WI-006", "WI-007", "WI-008"]
      parallelizable: false
      estimated_lines: 75
      notes: |
        依赖注入：scraper, db, ai_client 可通过参数传入（便于单元测试）。
        进度显示：使用 tqdm 显示 [N/M]。
        错误恢复：try/except 包裹每个视频的 AI 调用，失败记录到 errors 列表。
        最终统计：打印成功/跳过/失败数量。

    - order: 10
      id: "WI-010"
      name: "CLI 入口与主函数"
      files:
        - "src/cli.py (新增)"
        - "main.py (新增)"
      interface_contract: |
        # src/cli.py
        def build_parser() -> argparse.ArgumentParser
        def main() -> int  # 返回退出码

        # main.py
        from src.cli import main
        if __name__ == "__main__":
            sys.exit(main())
      dependencies: ["WI-002", "WI-005", "WI-009"]
      parallelizable: false
      estimated_lines: 80
      notes: |
        argparse 参数：
        --user (必需), --limit (int), --output (str, default ./output),
        --no-skip (flag), --headless (flag, default True),
        --interval-min (float, default 2.0), --interval-max (float, default 5.0)

        执行流程：
        1. 解析参数
        2. load_config()
        3. show_disclaimer()
        4. 用户确认 (input("继续? [y/N] "))
        5. asyncio.run(run_pipeline(...))
        6. 打印结果摘要
        7. 返回退出码

# =============================================================================
# Loop Contract 草案（首个 work item: WI-001）
# =============================================================================
loop_contract_draft:
  identity:
    loop_id: "LOOP-WI-001"
    task_id: "G4-WI-001"
    work_item_id: "WI-001"
    loop_type: "implementation"
    owner_role: "fullstack-dev"

  goal:
    outcome: "项目骨架搭建完成——目录结构、依赖声明、.env 模板、.gitignore 全部就位"
    acceptance_ids: []
    observable_result: |
      目录中存在 src/__init__.py, tests/__init__.py, .env.example, .gitignore 四个文件。
      .gitignore 包含 .env, *.db, __pycache__/, output/ 条目。
      .env.example 包含 ARK_API_KEY 和 DOUYIN_COOKIE 的占位说明。

  scope:
    allowed_paths:
      - "src/__init__.py"
      - "tests/__init__.py"
      - ".env.example"
      - ".gitignore"
    forbidden_paths:
      - "src/config.py"
      - "src/models.py"
      - "src/db.py"
      - "src/scraper.py"
      - "src/ai_client.py"
      - "src/output.py"
      - "src/pipeline.py"
      - "src/cli.py"
      - "src/disclaimer.py"
      - "main.py"
      - "requirement-contract.yaml"
      - "architecture-contract.yaml"
    allowed_operations:
      - "create_new_file"
      - "write_to_new_file"
    forbidden_operations:
      - "change_confirmed_requirements"
      - "weaken_acceptance_tests"
      - "skip_verification_hooks"
      - "force_push"
      - "destructive_git_operation"
      - "production_change"

  inputs:
    requirement_contract_ref: "requirement-contract.yaml"
    architecture_plan_ref: "architecture-contract.yaml"
    delivery_state_ref: null
    failure_evidence_refs: []

  verification:
    restart_from_first_required_step_after_change: true
    steps:
      - step: 1
        action: "检查项目目录存在且在 feat/douyin-batch-tool 分支"
        command: "cd /path/to/project && git branch --show-current"
        expected: "feat/douyin-batch-tool"
      - step: 2
        action: "确认文件已创建"
        command: "ls -la src/__init__.py tests/__init__.py .env.example .gitignore"
        expected: "四个文件均存在"
      - step: 3
        action: "确认 .gitignore 内容正确"
        command: "cat .gitignore"
        expected: "包含 .env, *.db, __pycache__, output/"
      - step: 4
        action: "确认 .env.example 内容正确"
        command: "cat .env.example"
        expected: "包含 ARK_API_KEY 和 DOUYIN_COOKIE 说明"
      - step: 5
        action: "确认 __init__.py 为空或仅含 docstring"
        command: "cat src/__init__.py && cat tests/__init__.py"
        expected: "文件存在且为有效的 Python 空模块"
    required_evidence_fields:
      - "command"
      - "cwd"
      - "exit_code"
      - "result"
      - "summary"
      - "timestamp"

  success:
    conditions:
      - "src/__init__.py 存在且是有效的 Python 模块"
      - "tests/__init__.py 存在且是有效的 Python 模块"
      - ".env.example 包含所有必需环境变量说明"
      - ".gitignore 覆盖所有敏感/生成文件"
      - "git status 显示只有预期的新文件变更"
    requires_independent_verification: false
    requires_zero_p0_p1: false

  budget:
    max_iterations: 3
    max_duration_minutes: 15
    max_cost: null
    repeated_failure_limit: 2

  stop_conditions:
    - "budget_exhausted"
    - "repeated_failure_limit_reached"
    - "no_observable_progress"
    - "new_regression_detected"
    - "scope_expansion_required"
    - "acceptance_change_required"
    - "architecture_change_required"
    - "destructive_action_required"
    - "environment_or_permission_blocked"

  escalation:
    target_role: "dev-delivery-team-team-lead"
    include:
      - "current_failure_signature"
      - "evidence_refs"
      - "attempted_changes"
      - "rollback_status"
      - "recommended_next_action"

  checkpoint:
    strategy: "before_each_iteration"
    current_ref: "43dc829"
    rollback_required_on_regression: true

  runtime_state:
    status: "not_started"
    iteration: 0
    started_at: null
    updated_at: null
    current_failure_signature: null
    previous_failure_signatures: []
    evidence_refs: []
    changed_paths: []
    outcome: null
