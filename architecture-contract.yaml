# =============================================================================
# 方案选择
# =============================================================================
solution:
  summary: |
    单入口 CLI 工具，核心流水线：CLI 参数解析 → 合规声明 → Playwright 采集视频列表 →
    逐视频调用豆包 ARK API 生成提纲 → JSON 输出。
    使用 SQLite 维护已处理记录实现增量跳过。
    所有敏感配置通过 .env 管理。

  alternatives_considered:
    - name: "方案 A（选定）：Playwright 全浏览器方案"
      description: |
        Playwright 启动 Chromium 浏览器，模拟用户滚动加载视频列表，从 DOM 提取数据。
        豆包 AI 通过 volcengine ARK 的 OpenAI 兼容 SDK 调用。
        SQLite 本地去重。
      pros:
        - "绕过抖音 API 签名（ABogus/XBogus）——无需逆向"
        - "JS 渲染的页面内容可直接获取"
        - "Playwright 生态成熟，Python 绑定完善"
        - "douyin-downloader 等项目已验证 Playwright 作为降级/主方案可行"
      cons:
        - "浏览器启动开销（~2-3 秒）"
        - "DOM 选择器依赖抖音前端结构，需维护"
        - "内存占用较高（~300MB Chromium 进程）"
      cost: "低——无付费依赖，仅需安装 Playwright + Chromium"
      compatibility: "与需求契约完全一致"

    - name: "方案 B：API 直连 + Playwright 降级（未选）"
      description: |
        参考 douyin-downloader 的双通道架构：优先通过 HTTP API 直连（需签名），
        风控时降级到 Playwright。需要逆向或引入 ABogus 签名 JS。
      pros:
        - "API 方案速度更快、资源消耗更低"
        - "douyin-downloader 已验证架构"
      cons:
        - "签名 JS 依赖外部项目，维护不确定性高"
        - "MVP 阶段增加签名逆向复杂度"
        - "用户已确认 OD-001 选择 Playwright"
      reason_rejected: "用户已确认 Playwright 方案；双通道增加初期复杂度，可在 v2 按需引入"

    - name: "方案 C：Selenium + requests 混合（未选）"
      description: "Selenium 获取初始页面，requests 解析后续数据"
      reason_rejected: "Playwright 对现代 SPA 支持更好；douyin 页面大量 JS 渲染，requests 无法处理"

  selected_reason: |
    方案 A 是用户 OD-001 确认的选择，且最低复杂度满足所有 P0 需求。
    单一 Playwright 通道避免了签名逆向的维护负担。
    豆包 API 通过 OpenAI 兼容接口调用（volcengine ARK 官方推荐方式），
    无需引入 volcengine-python-sdk 的额外依赖。

  rejected_speculation:
    - "多博主并行——已列入 OUT-004"
    - "视频帧提取多模态——用户 OD-002 选择 MVP 仅文本"
    - "配置文件 config.yaml——MVP 仅 .env + CLI 参数即可满足"
    - "日志系统——MVP 用 print + tqdm，延迟到 v2"

# =============================================================================
# 组件、接口与数据流
# =============================================================================

components:
  - id: "comp-cli"
    name: "CLI 入口与参数解析"
    file: "src/cli.py"
    responsibility: "argparse 参数解析、输入验证、合规声明触发、主流程调度"
    dependencies: ["comp-config", "comp-disclaimer", "comp-pipeline"]

  - id: "comp-config"
    name: "配置管理"
    file: "src/config.py"
    responsibility: ".env 加载、环境变量校验、提供 ARK_API_KEY / DOUYIN_COOKIE"
    dependencies: []

  - id: "comp-disclaimer"
    name: "合规声明"
    file: "src/disclaimer.py"
    responsibility: "启动时打印法律免责文本"
    dependencies: []

  - id: "comp-models"
    name: "数据模型"
    file: "src/models.py"
    responsibility: "VideoInfo, OutlineResult, ProcessRecord dataclass 定义"
    dependencies: []

  - id: "comp-db"
    name: "SQLite 持久化"
    file: "src/db.py"
    responsibility: "初始化数据库、增删查已处理视频 aweme_id 记录"
    dependencies: ["comp-models"]

  - id: "comp-scraper"
    name: "抖音视频采集器"
    file: "src/scraper.py"
    responsibility: "Playwright 浏览器启动、博主页面访问、滚动加载、DOM 提取视频 URL+标题"
    dependencies: ["comp-config", "comp-models"]

  - id: "comp-ai"
    name: "豆包 AI 客户端"
    file: "src/ai_client.py"
    responsibility: "ARK API 调用、Prompt 构建、超时重试、提纲提取"
    dependencies: ["comp-config"]

  - id: "comp-pipeline"
    name: "流水线编排"
    file: "src/pipeline.py"
    responsibility: "采集→去重→AI 解析→输出的主循环、进度显示、错误恢复"
    dependencies: ["comp-db", "comp-scraper", "comp-ai", "comp-output"]

  - id: "comp-output"
    name: "结果输出"
    file: "src/output.py"
    responsibility: "JSON 序列化写入、文件命名（含博主标识+日期）"
    dependencies: ["comp-models"]

interfaces:
  - id: "iface-001"
    from: "comp-cli"
    to: "comp-pipeline"
    contract: |
      def run_pipeline(user_url: str, limit: int | None, output_dir: str,
                       no_skip: bool, interval_range: tuple[float, float]) -> PipelineResult
    type: "函数调用，同步"

  - id: "iface-002"
    from: "comp-pipeline"
    to: "comp-scraper"
    contract: |
      class VideoScraper:
          async def scrape_user_videos(self, user_url: str) -> list[VideoInfo]:
              """返回该博主所有公开视频的 URL + 标题列表"""
    type: "类方法，异步"

  - id: "iface-003"
    from: "comp-pipeline"
    to: "comp-ai"
    contract: |
      class AIClient:
          def generate_outline(self, title: str, description: str = "") -> OutlineResult:
              """对单个视频标题+描述调用豆包 API，返回结构化提纲"""
    type: "类方法，同步（支持 timeout）"

  - id: "iface-004"
    from: "comp-pipeline"
    to: "comp-db"
    contract: |
      class ProcessDB:
          def is_processed(self, aweme_id: str) -> bool
          def mark_processed(self, aweme_id: str) -> None
          def processed_count(self) -> int
    type: "类方法，同步"

  - id: "iface-005"
    from: "comp-pipeline"
    to: "comp-output"
    contract: |
      def write_results(records: list[OutputRecord], output_path: str) -> str:
          """写入 JSON 文件，返回实际文件路径"""
    type: "函数调用，同步"

  - id: "iface-006"
    from: "comp-scraper"
    to: "comp-config"
    contract: |
      DOUYIN_COOKIE: str  # 从环境变量读取的 Cookie 字符串
    type: "环境变量字符串"

  - id: "iface-007"
    from: "comp-ai"
    to: "comp-config"
    contract: |
      ARK_API_KEY: str          # 火山引擎 API Key
      ARK_BASE_URL: str         # 默认 https://ark.cn-beijing.volces.com/api/v3
      ARK_MODEL: str            # 默认 doubao-seed-1-6-251015
    type: "环境变量字符串"

data_flows:
  - step: 1
    from: "CLI 参数 --user"
    to: "comp-cli → comp-pipeline"
    data: "user_url: str"
    description: "用户传入的抖音博主主页 URL"

  - step: 2
    from: "comp-pipeline → comp-scraper"
    to: "comp-scraper → 抖音 Web"
    data: "user_url → Playwright 浏览器请求"
    description: "Playwright 访问博主主页，滚动加载，提取 DOM 中的视频列表"

  - step: 3
    from: "comp-scraper"
    to: "comp-pipeline"
    data: "list[VideoInfo] — 每个包含 aweme_id, url, title, description"
    description: "采集到的视频元数据列表"

  - step: 4
    from: "comp-pipeline → comp-db"
    to: "comp-pipeline"
    data: "aweme_id → bool (is_processed)"
    description: "逐视频检查是否已处理（增量跳过）"

  - step: 5
    from: "comp-pipeline → comp-ai"
    to: "comp-pipeline"
    data: "title + description → OutlineResult (outline_markdown, raw_response)"
    description: "对新视频调用豆包 AI 生成文字提纲"

  - step: 6
    from: "comp-pipeline → comp-db"
    to: "comp-db"
    data: "aweme_id → mark_processed()"
    description: "成功处理后记录 aweme_id"

  - step: 7
    from: "comp-pipeline → comp-output"
    to: "文件系统"
    data: "list[OutputRecord] → JSON 文件"
    description: "所有结果写入 JSON 文件"

