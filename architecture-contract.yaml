      schema: |
        CREATE TABLE IF NOT EXISTS processed_videos (
            aweme_id TEXT PRIMARY KEY,
            title TEXT,
            processed_at TEXT DEFAULT (datetime('now')),
            status TEXT DEFAULT 'success'
        );
      location: "项目工作目录（与输出文件同目录或用户指定）"
      default_values: "无——首次运行时自动创建"
      history_handling: "不适用——绿场项目"
      migration_order: "在首次 Pipeline 运行前自动建表"
  migration_steps:
    - "无需迁移——绿场项目"
